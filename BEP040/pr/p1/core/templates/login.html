<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Login no sistema</title>
  </head>
  <body>
<form method="post">
    {% csrf_token %}
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <div>
        <label>Usuário:</label>
        <input type="text" name="username" required>
    </div>
    
    <div>
        <label>Senha:</label>
        <input type="password" name="password" required>
    </div>
    
    <button type="submit">Entrar</button>
</form>
  </body>
</html>
