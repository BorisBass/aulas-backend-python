<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Login no sistema</title>
  </head>
  <body>
    <h1>Bem-vindo, {{ nome }}!</h1>

    <p>Escolha uma opção:</p>
    <ul>
        <li><a href="{% url 'core:lista' %}">Minhas tarefas</a></li>
        {% if request.user.is_staff %}
        <li>
            <a href="{% url 'core:tarefas_todos' %}">Tarefas de todos os usuários</a>
        </li>
        {% endif %}
    </ul>
  </body>
</html>
