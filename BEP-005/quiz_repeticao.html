<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Estruturas de Repetição em Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-title {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .quiz-subtitle {
            color: #7f8c8d;
            font-size: 1.2em;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #ecf0f1;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-number {
            color: #3498db;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .question-text {
            color: #2c3e50;
            font-size: 1.3em;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .code-block {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
            font-size: 1em;
            line-height: 1.4;
            overflow-x: auto;
        }

        .options-container {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            position: relative;
        }

        .option:hover {
            background-color: #e3f2fd;
            border-color: #3498db;
            transform: translateY(-2px);
        }

        .option.selected {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }

        .option.correct {
            background-color: #27ae60;
            color: white;
            border-color: #229954;
        }

        .option.incorrect {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        .option-letter {
            font-weight: bold;
            margin-right: 10px;
            display: inline-block;
            width: 25px;
            height: 25px;
            background-color: #3498db;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 25px;
            font-size: 0.9em;
        }

        .option.selected .option-letter,
        .option.correct .option-letter,
        .option.incorrect .option-letter {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .buttons-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #3498db, #2ecc71);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            display: none;
        }

        .feedback.correct {
            background-color: #d5f4e6;
            color: #27ae60;
            border-left: 4px solid #27ae60;
        }

        .feedback.incorrect {
            background-color: #fadbd8;
            color: #e74c3c;
            border-left: 4px solid #e74c3c;
        }

        .results-container {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: white;
            font-size: 2em;
            font-weight: bold;
        }

        .results-text {
            color: #2c3e50;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .restart-btn {
            background: linear-gradient(45deg, #e74c3c, #f39c12);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .question-info {
            color: #7f8c8d;
            font-size: 0.9em;
            text-align: right;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 20px;
            }
            
            .quiz-title {
                font-size: 2em;
            }
            
            .buttons-container {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1 class="quiz-title">Quiz Python</h1>
            <p class="quiz-subtitle">Estruturas de Repetição (while, for)</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="quizContent">
            <div class="question-info">
                <span id="questionInfo">Questão 1 de 10</span>
            </div>
            
            <div class="question-container">
                <div class="question-number" id="questionNumber">Questão 1</div>
                <div class="question-text" id="questionText"></div>
                <div id="codeBlock" class="code-block" style="display: none;"></div>
            </div>

            <div class="options-container" id="optionsContainer"></div>

            <div class="feedback" id="feedback"></div>

            <div class="buttons-container">
                <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()" disabled>Anterior</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Próxima</button>
            </div>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="score-circle" id="scoreCircle"></div>
            <div class="results-text" id="resultsText"></div>
            <button class="restart-btn" onclick="restartQuiz()">Refazer Quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Qual é a principal diferença entre os laços 'while' e 'for' em Python?",
                options: [
                    "O 'while' é mais rápido que o 'for'",
                    "O 'for' é usado para iteração sobre sequências, enquanto o 'while' executa enquanto uma condição for verdadeira",
                    "O 'while' só funciona com números inteiros",
                    "Não há diferença, são sinônimos"
                ],
                correct: 1,
                explanation: "O 'for' é ideal para iterar sobre sequências conhecidas, enquanto o 'while' executa enquanto uma condição específica for verdadeira."
            },
            {
                question: "Qual será a saída do seguinte código?",
                code: `for i in range(3):
    print(i, end=" ")`,
                options: [
                    "1 2 3",
                    "0 1 2",
                    "0 1 2 3",
                    "1 2"
                ],
                correct: 1,
                explanation: "A função range(3) gera números de 0 até 2 (3 não incluído), então a saída será '0 1 2'."
            },
            {
                question: "O que acontece quando você executa este código?",
                code: `contador = 0
while contador < 3:
    print(contador)
    # contador += 1 (linha comentada)`,
                options: [
                    "Imprime 0, 1, 2",
                    "Imprime apenas 0",
                    "Cria um loop infinito imprimindo 0",
                    "Gera um erro"
                ],
                correct: 2,
                explanation: "Como a linha 'contador += 1' está comentada, o contador nunca é incrementado, criando um loop infinito que imprime 0 indefinidamente."
            },
            {
                question: "Qual é o resultado de range(2, 8, 2)?",
                options: [
                    "2, 4, 6",
                    "2, 4, 6, 8",
                    "2, 3, 4, 5, 6, 7",
                    "4, 6, 8"
                ],
                correct: 0,
                explanation: "range(2, 8, 2) gera números de 2 até 7 (8 não incluído) com passo 2, resultando em 2, 4, 6."
            },
            {
                question: "O que faz o comando 'break' em um laço?",
                options: [
                    "Pausa o laço temporariamente",
                    "Pula para a próxima iteração",
                    "Interrompe completamente o laço",
                    "Reinicia o laço do início"
                ],
                correct: 2,
                explanation: "O comando 'break' interrompe completamente a execução do laço, saindo dele imediatamente."
            },
            {
                question: "Qual será a saída deste código?",
                code: `for i in range(5):
    if i == 2:
        continue
    print(i, end=" ")`,
                options: [
                    "0 1 2 3 4",
                    "0 1 3 4",
                    "1 2 3 4",
                    "0 1 4"
                ],
                correct: 1,
                explanation: "O 'continue' pula a iteração quando i=2, então a saída será '0 1 3 4'."
            },
            {
                question: "Como você criaria um laço que executa exatamente 5 vezes?",
                options: [
                    "for i in range(5):",
                    "for i in range(1, 5):",
                    "for i in range(1, 6):",
                    "Tanto a opção A quanto C estão corretas"
                ],
                correct: 0,
                explanation: "range(5) gera 0, 1, 2, 3, 4 - exatamente 5 números. range(1, 6) geraria 1, 2, 3, 4, 5 - também 5 números, mas range(5) é mais comum para contar iterações."
            },
            {
                question: "O que são laços aninhados?",
                options: [
                    "Laços que executam em paralelo",
                    "Laços dentro de outros laços",
                    "Laços que se repetem infinitamente",
                    "Laços que usam apenas números pares"
                ],
                correct: 1,
                explanation: "Laços aninhados são estruturas onde um laço está dentro de outro laço, permitindo iterações mais complexas."
            },
            {
                question: "Qual será a saída deste código com laços aninhados?",
                code: `for i in range(2):
    for j in range(3):
        print(f"{i}{j}", end=" ")`,
                options: [
                    "00 01 02 10 11 12",
                    "01 02 10 11 12",
                    "00 11 22",
                    "0 1 2 0 1 2"
                ],
                correct: 0,
                explanation: "O laço externo executa 2 vezes (i=0,1) e para cada i, o laço interno executa 3 vezes (j=0,1,2), resultando em '00 01 02 10 11 12'."
            },
            {
                question: "Qual é a melhor prática para evitar loops infinitos com 'while'?",
                options: [
                    "Sempre usar 'for' em vez de 'while'",
                    "Garantir que a condição do while eventualmente se torne False",
                    "Usar apenas números negativos",
                    "Adicionar um 'break' em toda iteração"
                ],
                correct: 1,
                explanation: "Para evitar loops infinitos, é essencial garantir que a condição do 'while' eventualmente se torne False, seja modificando variáveis na condição ou usando 'break' quando necessário."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let answered = false;

        function loadQuestion() {
            const question = questions[currentQuestion];
            
            document.getElementById('questionInfo').textContent = `Questão ${currentQuestion + 1} de ${questions.length}`;
            document.getElementById('questionNumber').textContent = `Questão ${currentQuestion + 1}`;
            document.getElementById('questionText').textContent = question.question;
            
            // Show or hide code block
            const codeBlock = document.getElementById('codeBlock');
            if (question.code) {
                codeBlock.style.display = 'block';
                codeBlock.textContent = question.code;
            } else {
                codeBlock.style.display = 'none';
            }
            
            // Load options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + index)}</span>${option}`;
                optionElement.onclick = () => selectOption(index);
                optionsContainer.appendChild(optionElement);
            });
            
            // Update progress bar
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            // Reset state
            selectedAnswer = null;
            answered = false;
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            
            // Update next button text
            const nextBtn = document.getElementById('nextBtn');
            if (currentQuestion === questions.length - 1) {
                nextBtn.textContent = 'Finalizar';
            } else {
                nextBtn.textContent = 'Próxima';
            }
        }

        function selectOption(index) {
            if (answered) return;
            
            selectedAnswer = index;
            
            // Remove previous selections
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Add selection to clicked option
            document.querySelectorAll('.option')[index].classList.add('selected');
            
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (selectedAnswer === null) return;
            
            if (!answered) {
                // Show answer
                showAnswer();
                answered = true;
                document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'Ver Resultado' : 'Próxima';
            } else {
                // Move to next question or show results
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    loadQuestion();
                } else {
                    showResults();
                }
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function showAnswer() {
            const question = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            // Show correct answer
            options[question.correct].classList.add('correct');
            
            // Show incorrect answer if wrong
            if (selectedAnswer !== question.correct) {
                options[selectedAnswer].classList.add('incorrect');
            } else {
                score++;
            }
            
            // Show feedback
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';
            feedback.className = 'feedback ' + (selectedAnswer === question.correct ? 'correct' : 'incorrect');
            feedback.innerHTML = `<strong>${selectedAnswer === question.correct ? 'Correto!' : 'Incorreto!'}</strong><br>${question.explanation}`;
            
            // Disable option selection
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
            });
        }

        function showResults() {
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('resultsContainer').style.display = 'block';
            
            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('scoreCircle').textContent = percentage + '%';
            
            let message = '';
            if (percentage >= 90) {
                message = `Excelente! Você acertou ${score} de ${questions.length} questões. Você domina muito bem as estruturas de repetição em Python!`;
            } else if (percentage >= 70) {
                message = `Muito bom! Você acertou ${score} de ${questions.length} questões. Você tem um bom conhecimento sobre estruturas de repetição.`;
            } else if (percentage >= 50) {
                message = `Bom trabalho! Você acertou ${score} de ${questions.length} questões. Continue estudando para aprimorar seus conhecimentos.`;
            } else {
                message = `Você acertou ${score} de ${questions.length} questões. Recomendo revisar o conteúdo sobre estruturas de repetição e tentar novamente.`;
            }
            
            document.getElementById('resultsText').textContent = message;
            
            // Update progress bar to 100%
            document.getElementById('progressFill').style.width = '100%';
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            selectedAnswer = null;
            answered = false;
            
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('resultsContainer').style.display = 'none';
            
            loadQuestion();
        }

        // Initialize quiz
        loadQuestion();
    </script>
</body>
</html>
