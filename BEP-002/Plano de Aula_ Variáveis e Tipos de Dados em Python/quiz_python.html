<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Variáveis, Tipos de Dados e Entrada de Dados em Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .quiz-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-title {
            color: #333;
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .quiz-subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-number {
            color: #667eea;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .question-text {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .code-block {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #333;
            overflow-x: auto;
        }

        .options-container {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 1.1em;
        }

        .option:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .option.incorrect {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .option-letter {
            background: #667eea;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .option.selected .option-letter,
        .option.correct .option-letter,
        .option.incorrect .option-letter {
            background: rgba(255, 255, 255, 0.3);
        }

        .buttons-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .score-display {
            text-align: center;
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
        }

        .results-container {
            text-align: center;
            padding: 40px 20px;
        }

        .results-title {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #333;
        }

        .results-score {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .results-message {
            font-size: 1.3em;
            margin-bottom: 30px;
            color: #666;
        }

        .score-excellent {
            color: #28a745;
        }

        .score-good {
            color: #ffc107;
        }

        .score-needs-improvement {
            color: #dc3545;
        }

        .hidden {
            display: none;
        }

        .feedback {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            color: #0066cc;
        }

        .feedback.correct {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .quiz-container {
                padding: 20px;
                margin: 10px;
            }

            .quiz-title {
                font-size: 1.8em;
            }

            .question-text {
                font-size: 1.1em;
            }

            .buttons-container {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1 class="quiz-title">Quiz Python</h1>
            <p class="quiz-subtitle">Variáveis, Tipos de Dados e Entrada de Dados</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="score-display">
                Pergunta <span id="currentQuestion">1</span> de <span id="totalQuestions">10</span>
            </div>
        </div>

        <div id="quizContent">
            <div class="question-container">
                <div class="question-number" id="questionNumber">Pergunta 1</div>
                <div class="question-text" id="questionText"></div>
                <div class="options-container" id="optionsContainer"></div>
                <div id="feedback" class="feedback hidden"></div>
            </div>

            <div class="buttons-container">
                <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()" disabled>Anterior</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Próxima</button>
            </div>
        </div>

        <div id="resultsContainer" class="results-container hidden">
            <h2 class="results-title">Quiz Concluído!</h2>
            <div class="results-score" id="finalScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="btn btn-primary" onclick="restartQuiz()">Refazer Quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Qual é o tipo de dado da variável <code>idade = 25</code>?",
                options: ["str (string)", "int (inteiro)", "float (ponto flutuante)", "bool (booleano)"],
                correct: 1,
                explanation: "O valor 25 é um número inteiro, portanto o tipo de dado é int."
            },
            {
                question: "Qual função é usada para receber dados do usuário em Python?",
                options: ["print()", "input()", "get()", "read()"],
                correct: 1,
                explanation: "A função input() é usada para receber dados digitados pelo usuário."
            },
            {
                question: "O que a função <code>input()</code> sempre retorna?",
                options: ["Um número inteiro", "Um número decimal", "Uma string (texto)", "Um valor booleano"],
                correct: 2,
                explanation: "A função input() sempre retorna uma string, mesmo que o usuário digite números."
            },
            {
                question: "Qual é o resultado do código abaixo?<br><div class='code-block'>nome = \"Python\"<br>print(type(nome))</div>",
                options: ["&lt;class 'int'&gt;", "&lt;class 'str'&gt;", "&lt;class 'float'&gt;", "&lt;class 'bool'&gt;"],
                correct: 1,
                explanation: "A variável nome contém uma string, então type(nome) retorna &lt;class 'str'&gt;."
            },
            {
                question: "Como converter a string \"123\" para um número inteiro?",
                options: ["str(\"123\")", "int(\"123\")", "float(\"123\")", "bool(\"123\")"],
                correct: 1,
                explanation: "A função int() converte uma string para um número inteiro."
            },
            {
                question: "Qual é o tipo de dado da variável <code>preco = 19.99</code>?",
                options: ["int", "str", "float", "bool"],
                correct: 2,
                explanation: "O valor 19.99 tem casas decimais, portanto é do tipo float (ponto flutuante)."
            },
            {
                question: "Qual das seguintes é uma regra válida para nomes de variáveis em Python?",
                options: [
                    "Podem começar com números",
                    "Podem conter espaços",
                    "Podem começar com underscore (_)",
                    "Podem ser palavras reservadas como 'if'"
                ],
                correct: 2,
                explanation: "Nomes de variáveis podem começar com letras ou underscore (_), mas não com números."
            },
            {
                question: "O que acontece no código abaixo?<br><div class='code-block'>num1 = \"10\"<br>num2 = \"20\"<br>resultado = num1 + num2<br>print(resultado)</div>",
                options: ["Imprime 30", "Imprime 1020", "Gera um erro", "Imprime 10 + 20"],
                correct: 1,
                explanation: "Como num1 e num2 são strings, o operador + faz concatenação, resultando em \"1020\"."
            },
            {
                question: "Qual é a convenção em Python para indicar que uma variável deve ser tratada como constante?",
                options: [
                    "Usar letras minúsculas",
                    "Usar letras MAIÚSCULAS",
                    "Começar com underscore",
                    "Usar const antes do nome"
                ],
                correct: 1,
                explanation: "Por convenção, usamos letras MAIÚSCULAS para indicar constantes em Python (ex: PI = 3.14159)."
            },
            {
                question: "Qual é o resultado do código abaixo?<br><div class='code-block'>valor = True<br>print(type(valor))</div>",
                options: ["&lt;class 'int'&gt;", "&lt;class 'str'&gt;", "&lt;class 'float'&gt;", "&lt;class 'bool'&gt;"],
                correct: 3,
                explanation: "True é um valor booleano, então type(valor) retorna &lt;class 'bool'&gt;."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];
        let quizCompleted = false;

        function initQuiz() {
            document.getElementById('totalQuestions').textContent = questions.length;
            showQuestion();
        }

        function showQuestion() {
            const question = questions[currentQuestionIndex];
            
            document.getElementById('questionNumber').textContent = `Pergunta ${currentQuestionIndex + 1}`;
            document.getElementById('questionText').innerHTML = question.question;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.onclick = () => selectOption(index);
                
                optionElement.innerHTML = `
                    <div class="option-letter">${String.fromCharCode(65 + index)}</div>
                    <div>${option}</div>
                `;
                
                optionsContainer.appendChild(optionElement);
            });
            
            updateProgress();
            updateButtons();
            hideFeedback();
        }

        function selectOption(selectedIndex) {
            if (quizCompleted) return;
            
            const options = document.querySelectorAll('.option');
            options.forEach(option => option.classList.remove('selected'));
            options[selectedIndex].classList.add('selected');
            
            userAnswers[currentQuestionIndex] = selectedIndex;
            
            // Mostrar feedback imediatamente
            showFeedback(selectedIndex);
            
            document.getElementById('nextBtn').disabled = false;
        }

        function showFeedback(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const feedbackElement = document.getElementById('feedback');
            const options = document.querySelectorAll('.option');
            
            // Marcar resposta correta e incorreta
            options.forEach((option, index) => {
                if (index === question.correct) {
                    option.classList.add('correct');
                } else if (index === selectedIndex && index !== question.correct) {
                    option.classList.add('incorrect');
                }
            });
            
            // Mostrar explicação
            const isCorrect = selectedIndex === question.correct;
            feedbackElement.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackElement.innerHTML = `
                <strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto!'}</strong><br>
                ${question.explanation}
            `;
            feedbackElement.classList.remove('hidden');
        }

        function hideFeedback() {
            document.getElementById('feedback').classList.add('hidden');
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.classList.remove('correct', 'incorrect');
            });
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                showQuestion();
            } else {
                finishQuiz();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
                
                // Restaurar seleção anterior se existir
                if (userAnswers[currentQuestionIndex] !== undefined) {
                    const options = document.querySelectorAll('.option');
                    options[userAnswers[currentQuestionIndex]].classList.add('selected');
                    showFeedback(userAnswers[currentQuestionIndex]);
                    document.getElementById('nextBtn').disabled = false;
                }
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').disabled = userAnswers[currentQuestionIndex] === undefined;
            
            if (currentQuestionIndex === questions.length - 1) {
                document.getElementById('nextBtn').textContent = 'Finalizar';
            } else {
                document.getElementById('nextBtn').textContent = 'Próxima';
            }
        }

        function finishQuiz() {
            quizCompleted = true;
            
            // Calcular pontuação
            score = 0;
            userAnswers.forEach((answer, index) => {
                if (answer === questions[index].correct) {
                    score++;
                }
            });
            
            showResults();
        }

        function showResults() {
            document.getElementById('quizContent').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');
            
            const percentage = Math.round((score / questions.length) * 100);
            const finalScoreElement = document.getElementById('finalScore');
            const resultsMessageElement = document.getElementById('resultsMessage');
            
            finalScoreElement.textContent = `${score}/${questions.length} (${percentage}%)`;
            
            if (percentage >= 80) {
                finalScoreElement.className = 'results-score score-excellent';
                resultsMessageElement.textContent = 'Excelente! Você domina bem os conceitos básicos de Python!';
            } else if (percentage >= 60) {
                finalScoreElement.className = 'results-score score-good';
                resultsMessageElement.textContent = 'Bom trabalho! Você tem uma boa compreensão dos conceitos, mas pode revisar alguns pontos.';
            } else {
                finalScoreElement.className = 'results-score score-needs-improvement';
                resultsMessageElement.textContent = 'Continue estudando! Revise o material da aula e pratique mais os exercícios.';
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            quizCompleted = false;
            
            document.getElementById('quizContent').classList.remove('hidden');
            document.getElementById('resultsContainer').classList.add('hidden');
            
            showQuestion();
        }

        // Inicializar o quiz quando a página carregar
        window.onload = initQuiz;
    </script>
</body>
</html>
