{% extends "base.html" %}

{% block title %}{% if '/editar/' in request.path %}Editar{% else %}Criar{% endif %} Tarefa{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 600px;">
    <div class="card-header bg-dark text-white">
        <h1 class="h5 mb-0">{% if tarefa %}Editar: {{ tarefa.titulo }}{% else %}Nova Tarefa{% endif %}</h1>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}  <hr>
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="{% url 'core:lista' %}" class="btn btn-link text-muted">Voltar à lista</a>
        </form>
    </div>
</div>
{% endblock %}
