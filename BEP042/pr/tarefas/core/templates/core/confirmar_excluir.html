{% extends "base.html" %}

{% block title %}Excluir Tarefa{% endblock %}

{% block content %}
<div class="card border-danger mx-auto" style="max-width: 500px;">
    <div class="card-body text-center">
        <h1 class="card-title h4 text-danger">Excluir tarefa?</h1>
        <p class="card-text">Deseja realmente excluir <strong>{{ tarefa.titulo }}</strong>?</p>

        <form method="post" action="{% url 'core:excluir' tarefa.pk %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, excluir</button>
            <a href="{% url 'core:lista' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
