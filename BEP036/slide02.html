<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEP-036 - Slide 02: Migrations</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 18px; }
        .info { background: #EBF8FF; border-left: 4px solid #3182CE; padding: 12px; margin: 10px 0; border-radius: 4px; }
        pre { background: #1A202C; color: #E2E8F0; padding: 16px; border-radius: 8px; overflow:auto; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-database"></i> BEP-036: Modelos e Migrations</h1>
            <p>Modelar dados com Django ORM</p>
        </div>
        
        <div class="nav"></div>

        <div class="content">
            <div class="slide active" id="slide02">
                <h2><i class="fas fa-sync"></i> Migrations</h2>
                <p>Transformam models em tabelas do banco.</p>

                <div class="card" style="margin-top: 20px;">
                    <h3><i class="fas fa-terminal"></i> Passo a passo</h3>
                    <div class="code-block" style="margin-top: 12px;">
                        <pre><code># criar migrations
python manage.py makemigrations

# aplicar no banco
python manage.py migrate</code></pre>
                    </div>
                    <div class="info" style="margin-top: 12px;">
                        <p>Execute sempre que alterar os models.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>BEP-036: Modelos e Migrations</p>
            <img src="../Rodape.png" alt="Rodapé">
        </div>
    </div>
    
    <script src="../script.js"></script>
</body>
</html>
