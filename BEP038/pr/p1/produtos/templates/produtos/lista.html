<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Produtos</title>
</head>
<body>
    <h2>Produtos</h2>
    <ul>
        {% for p in produtos %}
            <li>{{ p.id }} - {{ p.desc }} - {{ p.preco }}%</li>
        {% empty %}
            <li>Nenhum produto cadastrado.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'produtos:home' %}">home produtos</a>

</body>
</html>
