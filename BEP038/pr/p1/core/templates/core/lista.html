<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tarefas</title>
</head>
<body>
    <h2>Tarefas</h2>
    <ul>
        {% for t in tarefas %}
            <li>{{ t.descricao }} - {{ t.prioridade }} - {{ t.status }}%</li>
        {% empty %}
            <li>Nenhuma tarefa cadastrada.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'core:home' %}">Voltar</a>
</body>
</html>
