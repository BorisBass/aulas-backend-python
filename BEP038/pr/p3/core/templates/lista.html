<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Lista de Tarefas</title>
  </head>
  <body>
    <h1>Tarefas</h1>
    <p><a href="{% url 'core:criar' %}">Nova tarefa</a></p>
    <ul>
      {% for t in tarefas %}
      <li>
        <a href="{% url 'core:detalhar' t.id %}">{{ t.descricao }}</a>
      </li>
      {% empty %}
      <li>Nenhuma tarefa.</li>
      {% endfor %}
    </ul>
  </body>
</html>
