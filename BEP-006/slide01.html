<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com Listas em Python</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <style>
        .slide-container {
            background: linear-gradient(135deg, #85929d 0%, #4B8BBE 100%);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 900px;
        }
        
        .title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #FFFFFF;
        }
        
        .subtitle {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 40px;
            color: #FFD43B;
        }
        
        .logo-container {
            margin-bottom: 40px;
        }
        
        .logo {
            width: 300px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-container">
            <div class="logo-container">
                <img src="images/python_logo.png" alt="Python Logo" class="logo">
            </div>
            <h1 class="title">Trabalhando com Listas em Python</h1>
            <p class="subtitle">Manipule coleções de dados de forma eficiente</p>
        </div>
    <div class="footer">
        <img src="../Rodape.png" alt="Rodapé">
    </div>
    </div> 

</body>
</html>
